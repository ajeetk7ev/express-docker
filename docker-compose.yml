version: '3.8'

services:
  backend:
    build:
      context: . # Looks for a Dockerfile in the current directory
      dockerfile: Dockerfile 
    ports:
      - "5000:5000" # Matches your Express PORT
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/users # Uses the db service name
    depends_on:
      - mongodb
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

volumes:
  mongo-data: # Persists your database locally

networks:
  app-network:
    driver: bridge
